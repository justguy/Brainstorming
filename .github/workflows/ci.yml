name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Using `npm install` instead of `npm ci` because the lock chronically
        # drifts on platform-specific optional deps (e.g. @emnapi/wasi-threads
        # for Linux runtimes, @esbuild/linux-x64) that macOS regen passes don't
        # capture. `npm install` still respects the lock when possible and is
        # tolerant of these gaps. Switch back to `npm ci` once the lock is
        # regenerated on a Linux host.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build:web

      - name: Build extension
        run: npm run build
